name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          APP_MODE: sandbox
          APP_ORIGIN: http://127.0.0.1:3000
          SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
